name: Build Linux and macOS releases

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS packages
        run: npm run dist -- --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: fleep-macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
            dist/*.blockmap
          if-no-files-found: error

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install AppImage build dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Build Linux AppImage
        run: npm run dist -- --linux --x64 --publish never

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: fleep-linux-x64
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
            dist/*.blockmap
          if-no-files-found: error
