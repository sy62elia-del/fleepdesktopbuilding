name: Build macOS DMGs

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.arch }} DMG
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build DMG
        run: npm run dist -- --mac --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: fleep-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  build-catalina:
    name: Build Catalina DMG (legacy Electron)
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Catalina-compatible Electron
        run: |
          npm pkg set devDependencies.electron=32.3.3
          npm install --package-lock=false

      - name: Set Catalina minimum system version
        run: npm pkg set build.mac.minimumSystemVersion=10.15.0

      - name: Build Catalina DMG
        run: npm run dist -- --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Catalina DMG
        uses: actions/upload-artifact@v4
        with:
          name: fleep-macos-catalina-x64
          path: dist/*.dmg
          if-no-files-found: error
