<!doctype html>
<html lang="en">
  <head>

    <meta

      content="default-src 'self'; style-src 'self'; img-src 'self'"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Starting Fleep</title>
    <link rel="stylesheet" href="loading.css">
